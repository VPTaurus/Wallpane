name: CI

on:
  push:
    branches: [main, Dev]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # FFmpeg (one pinned build, checked by its SHA-256), cached until the script that pins it changes.
      - uses: actions/cache@v4
        with:
          path: vendor/ffmpeg
          key: ffmpeg-${{ hashFiles('scripts/fetch-ffmpeg.js') }}
      - run: npm run fetch-ffmpeg
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-results
          path: test-results/

  # Builds the installer and the portable .exe when you run the workflow by hand, or when you publish a release on
  # GitHub (tag v1.2.0 for version 1.2.0): then the two .exe files are attached to that release.
  # Signing happens only if the CSC_LINK (certificate) and CSC_KEY_PASSWORD secrets are set; see README.
  build:
    needs: check
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    runs-on: windows-latest
    permissions:
      contents: write   # to attach the files to the release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: The release tag matches the version in package.json
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne '${{ github.event.release.tag_name }}') { throw "The release tag is ${{ github.event.release.tag_name }} but package.json says $v. Use the tag v$v." }
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: vendor/ffmpeg
          key: ffmpeg-${{ hashFiles('scripts/fetch-ffmpeg.js') }}
      - run: npm run dist
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: End-to-end tests against the built app
        run: npm run test:e2e
        env:
          WALLPANE_EXE: ${{ github.workspace }}\dist\win-unpacked\Wallpane.exe
      - uses: actions/upload-artifact@v5
        with:
          name: wallpane-windows
          path: dist/*.exe
      - name: Attach the installer and the portable .exe to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.event.release.tag_name }}' (Get-ChildItem dist/*.exe).FullName --clobber --repo '${{ github.repository }}'
